[project]
name = "recon-mcp"
version = "1.0.0"
description = "AI research engine — searches YouTube, papers, podcasts, scores for substance and credibility, creates NotebookLM notebooks"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.100.0",
    "patchright>=1.48.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=0.6.0",
    "requests>=2.31.0",
]

[project.scripts]
auto-research = "src.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
